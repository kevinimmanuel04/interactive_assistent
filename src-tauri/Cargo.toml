[workspace]
resolver = "2"
members = [
    ".",
    "crates/llm",
    "crates/cloud",
    "crates/router",
    "crates/voice",
    "crates/skills",
    "crates/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["Komorebi contributors"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"

[package]
name = "komorebi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Komorebi — anime-avatar virtual assistant"

[lib]
name = "komorebi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Internal crates (stub for now, wired in next phases).
komorebi-llm = { path = "crates/llm" }
komorebi-cloud = { path = "crates/cloud" }
komorebi-router = { path = "crates/router" }
komorebi-voice = { path = "crates/voice" }
komorebi-skills = { path = "crates/skills" }
komorebi-storage = { path = "crates/storage" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
