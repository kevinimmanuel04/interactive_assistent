name: Release build

# Builds a downloadable Komorebi installer for every supported OS.
#
# Triggers:
#   * push of a tag like v0.1.0  -> draft GitHub release + latest.json
#   * manual workflow_dispatch   -> per-run artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundle_glob: "src-tauri/target/*/release/bundle/nsis/*"
            target: x86_64-pc-windows-msvc
          - platform: macos-intel
            os: macos-13
            bundle_glob: "src-tauri/target/*/release/bundle/{dmg,macos}/*"
            target: x86_64-apple-darwin
          - platform: macos-arm
            os: macos-latest
            bundle_glob: "src-tauri/target/*/release/bundle/{dmg,macos}/*"
            target: aarch64-apple-darwin
          - platform: linux
            os: ubuntu-22.04
            bundle_glob: "src-tauri/target/*/release/bundle/{appimage,deb}/*"
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}
          cache-all-crates: true

      - name: Install Linux bundle deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            cmake \
            clang \
            libclang-dev

      - name: Install macOS build deps
        if: startsWith(matrix.platform, 'macos')
        run: brew install cmake

      - name: Install LLVM (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled Piper binary
        run: pnpm fetch:piper

      - name: Build Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target ${{ matrix.target }} -- --features full

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-${{ matrix.platform }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.bundle_glob }}

  updater-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles

      - name: Build latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          win=$(find bundles/komorebi-windows -name '*-setup.nsis.zip' | head -n1 || true)
          mac_x=$(find bundles/komorebi-macos-intel -name '*.app.tar.gz' | head -n1 || true)
          mac_a=$(find bundles/komorebi-macos-arm -name '*.app.tar.gz' | head -n1 || true)
          lin=$(find bundles/komorebi-linux -name '*.AppImage.tar.gz' | head -n1 || true)
          version="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          sig() { [ -n "${1:-}" ] && [ -f "${1}.sig" ] && cat "${1}.sig" || echo ""; }
          url() { [ -n "${1:-}" ] && echo "${base}/$(basename "$1")" || echo ""; }

          cat > latest.json <<EOF
          {
            "version": "${version}",
            "notes": "See release notes on GitHub.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": { "signature": "$(sig "$win")",   "url": "$(url "$win")" },
              "darwin-x86_64":  { "signature": "$(sig "$mac_x")", "url": "$(url "$mac_x")" },
              "darwin-aarch64": { "signature": "$(sig "$mac_a")", "url": "$(url "$mac_a")" },
              "linux-x86_64":   { "signature": "$(sig "$lin")",   "url": "$(url "$lin")" }
            }
          }
          EOF
          cat latest.json

      - name: Attach latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: latest.json
