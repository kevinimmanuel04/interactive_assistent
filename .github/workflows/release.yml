name: Release build

# Builds a downloadable Komorebi installer for manual testing.
#
# Triggers:
#   * push of a tag like v0.1.0  -> builds + (optionally) drafts a GitHub release
#   * manual workflow_dispatch   -> builds + uploads artifacts you can grab from the
#                                   run's "Artifacts" section (no release needed)
#
# The default build is cloud-only (no `local-llm`, no `stt`) so it compiles
# quickly and produces a slim NSIS installer. Local LLM / Whisper assets are
# downloaded at runtime from the app itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build (comma-separated: windows, macos, linux)"
        required: false
        default: "windows"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundle_glob: "src-tauri/target/release/bundle/nsis/*.exe"
          - platform: macos
            os: macos-latest
            bundle_glob: "src-tauri/target/release/bundle/dmg/*.dmg"
          - platform: linux
            os: ubuntu-latest
            bundle_glob: "src-tauri/target/release/bundle/deb/*.deb"
    runs-on: ${{ matrix.os }}
    # On workflow_dispatch, skip platforms the user didn't request.
    # On tag push, build everything in the matrix.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.platforms, matrix.platform)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - name: Install Linux bundle deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        run: pnpm tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-${{ matrix.platform }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

      # If this was triggered by a version tag, attach binaries to a draft
      # GitHub release so you get a permanent download link.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.bundle_glob }}
