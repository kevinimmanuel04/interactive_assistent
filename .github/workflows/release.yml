name: Release build

# Builds a downloadable Komorebi installer for Windows.
#
# Triggers:
#   * push of a tag like v0.1.0  -> draft GitHub release + latest.json
#   * manual workflow_dispatch   -> per-run artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows
          cache-all-crates: true

      - name: Install LLVM
        run: |
          choco install llvm --yes --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled Piper binary
        run: pnpm fetch:piper

      - name: Verify Piper binary
        shell: pwsh
        run: |
          $dir = "src-tauri/binaries/piper"
          if (-not (Test-Path $dir)) { throw "Missing $dir after fetch:piper" }
          $items = Get-ChildItem $dir -Recurse
          if ($items.Count -eq 0) { throw "Empty $dir after fetch:piper" }
          Write-Host "Piper contents ($($items.Count) entries):"
          $items | Select-Object -First 20 | ForEach-Object { Write-Host "  $($_.FullName)" }

      - name: Build Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc -- --features full

      - name: Verify NSIS bundle output
        shell: pwsh
        run: |
          $dir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          if (-not (Test-Path $dir)) {
            throw "NSIS bundle directory not found: $dir. Tauri did not produce an installer."
          }
          $exe = Get-ChildItem $dir -Filter '*-setup.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { throw "No *-setup.exe found in $dir." }
          $sig = Get-ChildItem $dir -Filter '*-setup.exe.sig' -ErrorAction SilentlyContinue
          if (-not $sig) {
            throw "No *-setup.exe.sig found. TAURI_SIGNING_PRIVATE_KEY secret is likely missing or invalid."
          }
          Write-Host "NSIS bundle contents:"
          Get-ChildItem $dir | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Stage installer (flatten paths)
        shell: pwsh
        run: |
          $src = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $dst = "staging/komorebi-windows"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item "$src/*" $dst -Force
          Write-Host "Staged contents:"
          Get-ChildItem $dst | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: komorebi-windows
          path: staging/komorebi-windows/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: staging/komorebi-windows/*

  updater-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: komorebi-windows
          path: bundles/komorebi-windows

      - name: List downloaded artifacts
        run: |
          echo "== bundles/ tree =="
          find bundles -maxdepth 4 -print || true

      - name: Build latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          win=$(find bundles/komorebi-windows -name '*-setup.exe' | head -n1 || true)
          version="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          sig() { [ -n "${1:-}" ] && [ -f "${1}.sig" ] && cat "${1}.sig" || echo ""; }
          url() { [ -n "${1:-}" ] && echo "${base}/$(basename "$1")" || echo ""; }

          if [ -z "$win" ] || [ ! -f "${win}.sig" ]; then
            echo "::error::Missing NSIS installer or .sig (win='$win'). Updater manifest would be empty."
            ls -R bundles/komorebi-windows || true
            exit 1
          fi

          cat > latest.json <<EOF
          {
            "version": "${version}",
            "notes": "See release notes on GitHub.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": { "signature": "$(sig "$win")", "url": "$(url "$win")" }
            }
          }
          EOF
          cat latest.json

      - name: Attach latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: latest.json
