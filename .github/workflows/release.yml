name: Release build

# Builds a downloadable Komorebi installer for manual testing.
#
# Triggers:
#   * push of a tag like v0.1.0  -> builds + (optionally) drafts a GitHub release
#   * manual workflow_dispatch   -> builds + uploads artifacts you can grab from the
#                                   run's "Artifacts" section (no release needed)
#
# The default build is cloud-only (no `local-llm`, no `stt`) so it compiles
# quickly and produces a slim NSIS installer. Local LLM / Whisper assets are
# downloaded at runtime from the app itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# softprops/action-gh-release needs contents:write to create / update
# a release. Default GITHUB_TOKEN is read-only since 2023.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            # nsis/ contains the installer .exe plus the updater .exe.sig / .zip
            bundle_glob: "src-tauri/target/release/bundle/nsis/*"
          - platform: macos
            os: macos-latest
            # Upload both the .dmg and the .app.tar.gz updater artifact
            bundle_glob: "src-tauri/target/release/bundle/{dmg,macos}/*"
          - platform: linux
            os: ubuntu-latest
            # AppImage is self-contained and what the updater uses on Linux
            bundle_glob: "src-tauri/target/release/bundle/{appimage,deb}/*"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.platform }}

      - name: Install Linux bundle deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        env:
          # Optional: set these repo secrets to produce signed updater
          # artifacts. If absent, Tauri still builds unsigned installers.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: komorebi-${{ matrix.platform }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: warn

      # If this was triggered by a version tag, attach binaries to a draft
      # GitHub release so you get a permanent download link.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.bundle_glob }}
